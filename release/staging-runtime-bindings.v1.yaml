schema_version: '1.2'
environment: staging
status: PREPARED_NOT_APPLIED
canonical_policy: config/n8n-policy.json
community_runtime_contract: config/n8n-community-runtime.v1.json
egress_policy: deploy/egress/n8n-egress-policy.v1.json
endpoint:
  authority: Caddy -> Kong -> Middleware
  base_url: https://api.codestra.co
  command_route: POST /v2/automation/commands
  operation_route: GET /v2/automation/commands/{command_id}
  result_submit_route: POST /api/v1/integrations/n8n/results
  result_read_route: GET /api/v1/integrations/n8n/results/{event_id}
  direct_private_middleware_listener_allowed: false
  direct_provider_endpoints_allowed: false
credential:
  owner: codestra-n8n-service-owner
  personal_account_allowed: false
  name: Codestra Middleware Service
  type: oAuth2Api
  grant_type: clientCredentials
  keycloak_client_id: n8n-automation
  audience: middleware-api
  scopes: [automation.command.read, n8n.results.read, n8n.results.submit]
  source: root-owned-bootstrap-secret-files
  embedded_in_workflow_json: false
editor_policy:
  edition: community
  strategy: caddy-oauth2-proxy-keycloak-plus-native-owner
  issuer: https://auth.codestra.co/realms/codestra
  roles: [n8n_operator, n8n_admin]
  authorization_code_flow: true
  pkce_method: S256
  native_owner_login_required: true
  native_owner_identity: codestra-n8n-service-owner
  direct_public_n8n_exposure: false
  service_accounts_may_approve_ad_spend: false
workflow_policy:
  effects_via_middleware_only: true
  canonical_workflow_ids_required: true
  tenant_id_required: true
  correlation_id_required: true
  idempotency_key_required_for_effects: true
  imported_active_by_default: false
  dangerous_nodes_excluded:
    - n8n-nodes-base.code
    - n8n-nodes-base.executeCommand
    - n8n-nodes-base.ftp
    - n8n-nodes-base.git
    - n8n-nodes-base.localFileTrigger
    - n8n-nodes-base.readWriteFile
    - n8n-nodes-base.ssh
production_bindability:
  status: NO_GO
  runtime_execution_allowed: false
  production_control_plane_executable: false
  prepared_endpoint_base_url: https://api.codestra.co
  template_endpoint_base_url: https://middleware.invalid
  reason: Runtime endpoint, credential, editor, egress, and staging dry-run evidence are not verified.
egress:
  default_action: DENY
  allowed_https_hostnames: [api.codestra.co, auth.codestra.co]
  runtime_network_enforcement_required: true
  evidence_required_before_verification: true
activation:
  workflows_active: false
  activation_requires:
    - endpoint_binding.status=VERIFIED in config/n8n-policy.json
    - credential_binding.status=VERIFIED in config/n8n-policy.json
    - editor_access.status=VERIFIED in config/n8n-policy.json
    - N4 command-envelope convention resolved in estate integration authority
    - cross-repository Middleware/N8N contract tests pass
    - successful staging dry-run execution
    - observability correlation evidence
forbidden:
  - direct private Middleware listener
  - direct Meta write
  - direct Google Ads write
  - direct Odoo cross-system write
  - provider secret storage
  - advertising budget approval
  - production credential use
